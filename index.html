<html lang="te">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<body>
<title>TET తెలుగు 2A ప్రశ్న బ్యాంక్</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Telugu:wght@400;500;700&family=Gotu&display=swap">
<style>
/* Layout: hero, then either the batch menu or one question card at a time */
:root{
  --bg:#f6f3ec; --surface:#fffdf8; --ink:#241f1a; --muted:#6d6459;
  --line:#ded5c6; --accent:#9a3b1f; --accent-soft:#f3e2d8;
  --ok:#1f6b4a; --ok-soft:#dff0e6; --no:#a32626; --no-soft:#f8dede;
  --display:'Gotu',Georgia,serif;
  --body:'Noto Sans Telugu','Nirmala UI',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#16130f; --surface:#211c17; --ink:#f0e9df; --muted:#a79c8d;
  --line:#3a322a; --accent:#e4906c; --accent-soft:#3a2319;
  --ok:#7fd3a7; --ok-soft:#1d3329; --no:#f0908d; --no-soft:#3a1f1f; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#16130f; --surface:#211c17; --ink:#f0e9df; --muted:#a79c8d;
  --line:#3a322a; --accent:#e4906c; --accent-soft:#3a2319;
  --ok:#7fd3a7; --ok-soft:#1d3329; --no:#f0908d; --no-soft:#3a1f1f; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);margin:0}
.wrap{max-width:860px;margin:0 auto;padding-inline:16px;padding-block:24px 48px}

header.hero{display:flex;gap:18px;align-items:center;flex-wrap:wrap;
  background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
header.hero img{width:104px;height:104px;object-fit:cover;object-position:center top;
  border-radius:50%;border:3px solid var(--accent);max-width:100%}
.hero-text{flex:1 1 220px;min-width:0}
.eyebrow{font-family:var(--display);letter-spacing:.14em;text-transform:uppercase;
  font-size:.72rem;color:var(--accent);margin:0 0 4px}
h1{font-size:1.4rem;line-height:1.35;margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:.87rem;margin:8px 0 0;line-height:1.7}

h2{font-family:var(--display);font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;
  color:var(--accent);margin:28px 0 12px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.batch{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;
  display:flex;flex-direction:column;gap:10px;min-width:0;text-align:left;cursor:pointer;
  font-family:var(--body);color:var(--ink);transition:border-color .15s}
.batch:hover{border-color:var(--accent)}
.batch .range{font-family:var(--display);font-size:1.55rem;color:var(--accent);
  font-variant-numeric:tabular-nums;line-height:1}
.batch .topic{margin:0;font-size:.92rem;line-height:1.7;color:var(--muted);flex:1}
.batch .done{font-size:.82rem;color:var(--ok);font-weight:700}
.batch:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.bar{display:flex;align-items:center;gap:12px;margin:22px 0 14px;flex-wrap:wrap}
.track{flex:1 1 140px;height:7px;background:var(--line);border-radius:99px;overflow:hidden;min-width:0}
.fill{height:100%;width:0;background:var(--accent);transition:width .3s ease}
.count{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.score{font-size:.85rem;color:var(--accent);font-weight:700;font-variant-numeric:tabular-nums}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}
.qno{display:inline-block;background:var(--accent-soft);color:var(--accent);font-weight:700;
  font-size:.76rem;padding:3px 10px;border-radius:99px;margin-bottom:12px}
.qtext{font-size:1.05rem;line-height:1.85;margin:0 0 6px;white-space:pre-line}
.qask{font-size:1rem;line-height:1.8;margin:12px 0 0;font-weight:700}
.opts{display:grid;gap:10px;margin:18px 0 0}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;
  font-family:var(--body);font-size:1rem;line-height:1.7;color:var(--ink);
  background:transparent;border:1.5px solid var(--line);border-radius:10px;
  padding:12px 14px;cursor:pointer;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt .k{flex:0 0 auto;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.opt .t{min-width:0}
.opt.correct{background:var(--ok-soft);border-color:var(--ok)}
.opt.correct .k{color:var(--ok)}
.opt.wrong{background:var(--no-soft);border-color:var(--no)}
.opt.wrong .k{color:var(--no)}

.exp{margin-top:16px;border-left:4px solid var(--accent);background:var(--accent-soft);
  border-radius:0 10px 10px 0;padding:14px 16px}
.exp h3{margin:0 0 6px;font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;
  color:var(--accent);font-family:var(--display)}
.exp p{margin:0;font-size:.96rem;line-height:1.8}
.verdict{font-weight:700;margin:0 0 8px;font-size:.95rem}
.verdict.y{color:var(--ok)} .verdict.n{color:var(--no)}

.nav{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
button.act{font-family:var(--body);font-size:.94rem;font-weight:700;padding:11px 20px;
  border-radius:10px;border:1.5px solid var(--accent);cursor:pointer}
button.act.primary{background:var(--accent);color:#fff}
button.act.ghost{background:transparent;color:var(--accent)}
button.act:disabled{opacity:.4;cursor:default}

.result{text-align:center;padding:30px 20px}
.big{font-family:var(--display);font-size:3rem;color:var(--accent);margin:6px 0;
  font-variant-numeric:tabular-nums}
.result p{color:var(--muted);margin:4px 0}

footer{margin-top:28px;text-align:center;font-size:.86rem;color:var(--muted);
  border-top:1px solid var(--line);padding-top:16px;line-height:1.8}
footer strong{color:var(--accent)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

లి కృష్ణశాస్త్రి భావకవి — ఆయన పేరు పేరాలో లేదు, పురాణేతిహాసాలు రచించలేదు."}, {"passage": "నిన్నటి యలవాటునునుసరించి జనులు మూఁగిరి. నేను గూడఁ బోయి లోనఁ గూర్చుంటిని. “ఎండలప్పుడే మిగులఁ దీవ్రముగ నున్నవి. వైశాఖమాసమున నెట్లుండునో?” యని నేను యాదృచ్ఛికముగఁ బలుక నంతవఱకేమియు మాటలాడక యేదియో తనలోఁ దానాలోచించుఁ కొనుచుఁ దలవంచుకొని కూరుచుండి యుండిన జంఘాల శాస్త్రి తటాలున లేచి యుపన్యాస పీఠమెక్కి యిట్లు పలుకఁదొడగెను. కావా? ఎక్కువగుచునే యున్నవి. ఇంకయు నెక్కువగును. భరించుటకు శక్యము కాకుండ నెక్కువయగును.", "q": "జంఘాలశాస్త్రి ఆలోచన వీటిని గురించి ఉన్నది.", "o": ["వానలు", "ఎండలు", "చలి", "వరదలు"], "a": 1, "e": "పేరాలో 'ఎండలప్పుడే మిగులఁ దీవ్రముగ నున్నవి' అనే మాటతో ఉపన్యాసం మొదలవుతుంది. ఎండలు ఇంకా ఎక్కువవుతాయని, భరించలేనంతగా పెరుగుతాయని శాస్త్రి ఆలోచన. కాబట్టి సమాధానం ఎండలు."}, {"passage": "తిరుపతి వేంకటకవులు రచించిన పాండవోద్యోగ, విజయాది నాటకాలను నేటికీ ప్రేక్షకులు ఆదరిస్తున్నారు. సాంఘిక నాటకాలెన్ని వచ్చినా వీరి నాటకాలలో కలకండ పలుకులవంటి పద్యాలు, సంభాషణలు తెలుగు వారికి మిక్కిలి ప్రీతిపాత్రములైనాయి.", "q": "తిరుపతి వేంకటకవుల నాటకాలలో పద్యాలను దీనితో పోల్చారు.", "o": ["చెరుకు తీపి", "కలకండ", "తేనె", "పనసతొన"], "a": 1, "e": "పేరాలో స్పష్టంగా 'కలకండ పలుకులవంటి పద్యాలు' అని ఉంది. కలకండ పలుకుల వలె తియ్యగా ఉంటాయని ఉపమానం."}, {"passage": "పురాణాలను, భారత రామాయణాలను తెలుగులో రచించిన వావిల కొలను, జనమంచి, శ్రీపాద కృష్ణమూర్తి శాస్త్రి ప్రభృతులు సామాన్య ప్రజలకు పూర్వగంథాల వైశిష్ట్యాన్ని తెలియజెప్పారు. ఆధునిక కవిత్వానికి, పూర్వ కవిత్వానికి గల వ్యత్యాసాలను అర్థం చేసుకోవటానికి వీరి రచనలు తోడ్పడ్డాయి. ఈ విధంగా వీరి రచనలు నవ్య సాహిత్య వికాసానికి పరోక్షంగా తోడ్పడ్డాయి.", "q": "పై పేరా ఆధారంగా సరైన వాక్యం గుర్తించండి", "o": ["శ్రీపాద కృష్ణమూర్తి శాస్త్రి భారత, రామాయణాలను తెలుగులో రచించలేదు.", "నవ్య సాహిత్య వికాసానికి వీరి రచనలు ప్రత్యక్షంగా తోడ్పడ్డాయి.", "ఆధునిక, పూర్వ కవిత్వాల వ్యత్యాసం తెలుసుకోవడానికి వీరి రచనలు తోడ్పడ్డాయి.", "జనమంచి శేషాద్రిశర్మ మహాప్రస్థానం రాశాడు."], "a": 2, "e": "పేరాలో ఉన్నది మూడవ వాక్యమే. మొదటిది, రెండవది పేరాకు విరుద్ధం (ప్రత్యక్షంగా కాదు, పరోక్షంగా). మహాప్రస్థానం రాసినది శ్రీశ్రీ, జనమంచి కాదు."}, {"passage": "నిన్నటి యలవాటునునుసరించి జనులు మూఁగిరి. “ఎండలప్పుడే మిగులఁ దీవ్రముగ నున్నవి. వైశాఖమాసమున నెట్లుండునో?” యని నేను యాదృచ్ఛికముగఁ బలుక నంతవఱకేమియు మాటలాడక యేదియో తనలోఁ దానాలోచించుఁ కొనుచుఁ దలవంచుకొని కూరుచుండి యుండిన జంఘాల శాస్త్రి తటాలున లేచి యుపన్యాస పీఠమెక్కి యిట్లు పలుకఁదొడగెను.", "q": "పై పేరాలో ప్రస్తావించిన మాసము", "o": ["మాఘం", "చైత్రం", "వైశాఖం", "కార్తీకం"], "a": 2, "e": "'వైశాఖమాసమున నెట్లుండునో?' అనే వాక్యంలో వైశాఖ మాసం ప్రస్తావించబడింది. ఇప్పుడే ఇంత ఎండ ఉంటే వైశాఖంలో ఎలా ఉంటుందో అని ఆశ్చర్యం."}, {"q": "“భోజరాజీయం” కావ్యాన్ని రచించిన కవి", "o": ["అనంతామాత్యులు", "కొఱవి గోపరాజు", "జక్కన", "మంచెన"], "a": 0, "e": "'భోజరాజీయం' రచయిత అనంతామాత్యుడు (అనంతామాత్యులు). ఇది భోజరాజు కథల ఆధారంగా రాసిన కావ్యం. ఇతడు 'ఛందోదర్పణం' కూడా రచించాడు."}, {"q": "“ఆముక్తమాల్యద” ప్రబంధాన్ని రచించిన కవి", "o": ["అల్లసాని పెద్దన", "నంది తిమ్మన", "శ్రీకృష్ణదేవరాయలు", "మాదయగారి మల్లన"], "a": 2, "e": "'ఆముక్తమాల్యద' (విష్ణుచిత్తీయం) రచించినది శ్రీకృష్ణదేవరాయలు. ఇది పంచకావ్యాలలో ఒకటి; గోదాదేవి, విష్ణుచిత్తుల కథ ఇతివృత్తం."}, {"q": "కింది వానిలో పోతన రచన కానిది", "o": ["వీరభద్ర విజయం", "భోగినీ దండకం", "మహాభాగవతం", "కుమార సంభవం"], "a": 3, "e": "పోతన రచనలు — మహాభాగవతం, వీరభద్ర విజయం, భోగినీ దండకం, నారాయణ శతకం. 'కుమారసంభవం' రాసినది నన్నెచోడుడు. కాబట్టి అది పోతన రచన కాదు."}, {"q": "కింద ఇచ్చిన కవులు – బిరుదులలో సరైన క్రమాన్ని గుర్తించండి\ni) నన్నయ   ii) ఎర్రన   iii) తిక్కన   iv) శ్రీనాథుడు\nA) కవి సార్వభౌముడు   B) ఉభయకవి మిత్రుడు   C) ప్రబంధ పరమేశ్వరుడు   D) ఆదికవి", "o": ["i–D, ii–C, iii–B, iv–A", "i–C, ii–D, iii–B, iv–A", "i–D, ii–B, iii–C, iv–A", "i–D, ii–A, iii–C, iv–B"], "a": 0, "e": "నన్నయ — ఆదికవి (D), ఎర్రన — ప్రబంధ పరమేశ్వరుడు (C), తిక్కన — ఉభయకవి మిత్రుడు (B), శ్రీనాథుడు — కవిసార్వభౌముడు (A). కాబట్టి సరైన క్రమం i–D, ii–C, iii–B, iv–A."}, {"q": "తాళ్ళపాక అన్నమాచార్యునికి గల బిరుదు", "o": ["సంగీతరహస్య కళానిధి", "పదకవితా పితామహుడు", "వికటకవి", "భవ్యభారతి"], "a": 1, "e": "తాళ్ళపాక అన్నమాచార్యుడు వేలాది సంకీర్తనలు రచించి తెలుగు పదకవితకు మూలపురుషుడయ్యాడు. అందుకే ఆయనకు 'పదకవితా పితామహుడు' అనే బిరుదు."}, {"q": "“ఆంధ్రకవితా పితామహుడు” బిరుదు కల తెలుగు కవి", "o": ["నంది తిమ్మన", "నన్నయభట్టు", "శ్రీనాథుడు", "అల్లసాని పెద్దన"], "a": 3, "e": "అల్లసాని పెద్దనకు 'ఆంధ్రకవితా పితామహుడు' అనే బిరుదు ఉంది. ఈయన శ్రీకృష్ణదేవరాయల ఆస్థానంలో అష్టదిగ్గజాల్లో అగ్రగణ్యుడు; 'మనుచరిత్ర' రచయిత."}, {"q": "‘నక్షత్రకుడు’ పాత్ర కలిగిన కావ్యము", "o": ["వసుచరిత్ర", "నరసభూపాలీయం", "హరిశ్చంద్రోపాఖ్యానము", "కుమారసంభవం"], "a": 2, "e": "నక్షత్రకుడు హరిశ్చంద్రుని కథలోని పాత్ర — విశ్వామిత్రుని శిష్యుడు, హరిశ్చంద్రుని వెంబడించి డబ్బు వసూలు చేసేవాడు. కాబట్టి 'హరిశ్చంద్రోపాఖ్యానము'."}, {"q": "శ్రీకృష్ణదేవరాయలు రచించిన ‘ఆముక్తమాల్యద’ కావ్యంలోని పాత్ర", "o": ["నలుడు", "విష్ణుచిత్తుడు", "గోడగూచి", "విప్రనారాయణుడు"], "a": 1, "e": "ఆముక్తమాల్యదలో ప్రధాన పాత్రలు విష్ణుచిత్తుడు (పెరియాళ్వార్) మరియు ఆయన కుమార్తె గోదాదేవి. అందుకే ఈ కావ్యానికి 'విష్ణుచిత్తీయం' అనే పేరు కూడా ఉంది."}, {"q": "‘మనుచరిత్ర’ కావ్యంలో కనిపించే పాత్ర", "o": ["గోదాదేవి", "గిరిక", "ప్రవరుడు", "సత్యభామ"], "a": 2, "e": "అల్లసాని పెద్దన రచించిన 'మనుచరిత్ర'లో ప్రవరుడు, వరూధిని ప్రధాన పాత్రలు. గిరిక వసుచరిత్రలోనిది, సత్యభామ పారిజాతాపహరణంలోనిది, గోదాదేవి ఆముక్తమాల్యదలోనిది."}, {"q": "కవిత్రయం రచించిన ‘ఆంధ్రమహాభారతం’ ఈ ప్రక్రియకు చెందినది", "o": ["నాటకం", "ప్రబంధం", "ఇతిహాసం", "పురాణం"], "a": 2, "e": "మహాభారతం ఇతిహాస ప్రక్రియకు చెందినది. నన్నయ, తిక్కన, ఎర్రన (కవిత్రయం) దీన్ని తెలుగులోకి అనువదించారు. రామాయణం, భారతం రెండూ ఇతిహాసాలు."}, {"q": "కింది వానిలో ఏ ప్రక్రియలో ‘మకుటం’ తప్పనిసరిగా ఉంటుంది.", "o": ["యక్షగానం", "పురాణం", "నాటకం", "శతకం"], "a": 3, "e": "శతక లక్షణాలు — నూరు (లేదా అంతకు మించిన) పద్యాలు, ముక్తక రీతి, మకుటం. ప్రతి పద్యం చివర పునరావృతమయ్యే మకుటం శతకానికి తప్పనిసరి లక్షణం."}, {"q": "కింది వానిలో ప్రబంధ ప్రక్రియకు చెందనిది", "o": ["పారిజాతాపహరణం", "సుగ్రీవవిజయం", "వసుచరిత్ర", "విజయవిలాసం"], "a": 1, "e": "'సుగ్రీవవిజయం' కందుకూరి రుద్రకవి రచించిన యక్షగానం — ఇది తొలి యక్షగానంగా ప్రసిద్ధం. మిగిలిన మూడూ ప్రబంధాలు."}, {"q": "విజయరాఘవ నాయకునిచే కనకాభిషేకం చేయించుకొన్న కవయిత్రి", "o": ["రంగాజమ్మ", "ముద  గోపీచంద్ రాసిన 'అసమర్థుని జీవయాత్ర'లో ప్రధాన పాత్ర సీతారామారావు. ఇది తెలుగులో తొలి మనోవిశ్లేషణాత్మక నవలగా గుర్తింపు పొందింది."}, {"q": "‘నాటకం, నవల’ గూర్చి సరికానిది ఏది", "o": ["నాటక శిల్పం నవలా శిల్పాని కన్నా పూర్తిగా భిన్నమైనది", "నవల పఠన యోగ్యమైన శ్రవ్యకావ్యం", "నాటకం ప్రదర్శన యోగ్యమైన దృశ్యకావ్యం", "నవల, నాటకం రెండింటికీ కాలవ్యవధి ఉంది"], "a": 3, "e": "నాటకానికి ప్రదర్శన సమయం అనే కాలవ్యవధి తప్పనిసరి. నవలకు అటువంటి కాల పరిమితి లేదు — ఎంత పొడవైనా రాయవచ్చు. కాబట్టి నాల్గవ వాక్యం సరికానిది."}, {"q": "కింది వాటిలో ‘కథ’ లక్షణం కానిది", "o": ["జీవితంలో ఒకచిన్న సంఘటనకు పరిమితం.", "ఒకే సన్నివేశంతో ఉంటుంది.", "అంకములుగా విభజిస్తారు.", "సంక్షిప్తత, స్పష్టత, సూటిదనం ఉంటుంది."], "a": 2, "e": "అంకాలుగా విభజించడం నాటక లక్షణం, కథ లక్షణం కాదు. కథ ఒక చిన్న సంఘటనకు పరిమితమై, సంక్షిప్తత, ఏకసూత్రత కలిగి ఉంటుంది."}, {"q": "గజల్ లో చరణాన్ని ........ అంటారు", "o": ["మత్లా", "మక్తా", "తఖల్లుస్", "ముక్తీ"], "a": 1, "e": "గజల్ పరిభాషలో చరణాన్ని 'మక్తా' అంటారు. మొదటి ద్విపదను 'మత్లా', కవి కలం పేరును 'తఖల్లుస్' అంటారు."}, {"passage": "“ఎప్పుడో మానిషాదతో పుట్టిందట కవిత్వం\nఎప్పుడైనా అలాంటి ఘటనతోనే పుట్టడం దాని తత్త్వం”", "q": "అని అన్నది", "o": ["ఆరుద్ర", "వేటూరి", "సిరివెన్నెల", "సి. నా. రె"], "a": 0, "e": "ఆరుద్ర (భాగవతుల సదాశివ శంకర శాస్త్రి) మాట ఇది. వాల్మీకి 'మా నిషాద' శ్లోకంతో కవిత్వం పుట్టిందనే సంప్రదాయాన్ని ప్రస్తావిస్తూ, కరుణ కలిగించే ఘటన నుంచే కవిత్వం పుడుతుందని చెప్పాడు."}, {"q": "“నేనింతా ఒక పిడికెడు మట్టే కావచ్చు. కానీ కలమెత్తితే నాకు ఒక దేశపు జెండాకున్న పొగరుంది.” అన్నది", "o": ["శ్రీశ్రీ", "తిలక్", "శేషేంద్ర", "చలం"], "a": 2, "e": "గుంటూరు శేషేంద్ర శర్మ మాట ఇది. కవి ఆత్మగౌరవాన్ని, కలం శక్తిని చాటే ప్రసిద్ధ వాక్యం."}, {"passage": "“రాష్ట్రసిద్ధి కొఱకు రక్తంబు కార్చిన\nకవిని నేను, గాంధి కవిని నేను”", "q": "అన్నది", "o": ["గడియారం వేంకట శేషశాస్త్రి", "పుట్టపర్తి నారాయణాచార్యులు", "పురిపండా అప్పలస్వామి", "తుమ్మల సీతారామ మూర్తి"], "a": 3, "e": "తుమ్మల సీతారామ మూర్తి చౌదరి మాట ఇది. ఆయన గాంధేయవాదిగా, జాతీయోద్యమ కవిగా ప్రసిద్ధులు; 'మహాత్మకథ' ఆయన రచన."}, {"q": "ఎవరి రచనాశైలిలో ‘సూక్తివైచిత్రి’ పేరెన్నికగన్నది?", "o": ["తిక్కన", "పోతన", "ఎఱ్ఱన", "నన్నయ"], "a": 2, "e": "కవిత్రయంలో ఎఱ్ఱన శైలి లక్షణం 'సూక్తివైచిత్రి'. నన్నయది అక్షరరమ్యత, తిక్కనది నాటకీయత, ఎఱ్ఱనది సూక్తివైచిత్రి."}, {"q": "‘అక్షర రమ్యత, ప్రసన్నకథా కలితార్థయుక్తి, నానారుచిరార్థ సూక్తినిధిత్వం’ వీరి కవిత్వ ప్రధాన లక్షణాలు?", "o": ["ఎఱ్ఱన", "నన్నయ", "తిక్కన", "శ్రీనాథుడు"], "a": 1, "e": "నన్నయ తన భారత అవతారికలోనే ఈ మూడు లక్షణాలను పేర్కొన్నాడు — ప్రసన్నకథా కలితార్థయుక్తి, అక్షరరమ్యత, నానారుచిరార్థ సూక్తినిధిత్వం. ఇవి నన్నయ కవితా లక్షణాలు."}, {"q": "తిక్కన రచనాశైలిలో ప్రధానమైనది ఏది?", "o": ["అక్షరరమ్యత", "సూక్తివైచిత్రి", "నాటకీయత", "నానారుచిరార్థ సూక్తి నిధిత్వం"], "a": 2, "e": "తిక్కన పాత్రల సంభాషణలకు ప్రాధాన్యమిచ్చి, సన్నివేశాలను రంగస్థలంపై జరుగుతున్నట్లు చిత్రించాడు. అందుకే ఆయన శైలి లక్షణం 'నాటకీయత'."}, {"q": "“నందంపూడి శాసనం” రచయిత", "o": ["నారాయణభట్టు", "నన్నయ", "శ్రీపతి పండితారాధ్యుడు", "అయ్యనభట్టు"], "a": 1, "e": "నందంపూడి శాసనాన్ని రాసినది నన్నయ. ఇది రాజరాజనరేంద్రుని కాలం నాటిది; నన్నయ గద్య శైలికి నిదర్శనం."}, {"q": "‘ఆంధ్ర’ శబ్దానికి సంస్కృతంలో మొట్టమొదటి ప్రయోగం ఇందులో కనిపిస్తుంది", "o": ["ఐతరేయ బ్రాహ్మణం", "నాట్యశాస్త్రం", "కువలయమాల", "వ్యాసభారతం"], "a": 0, "e": "'ఆంధ్ర' అనే శబ్దం తొలిసారిగా ఐతరేయ బ్రాహ్మణంలో కనిపిస్తుంది. విశ్వామిత్రుని కుమారుల కథలో ఆంధ్ర, పుండ్ర, శబర మొదలైన జాతుల ప్రస్తావన ఉంది."}, {"q": "కింది వాటిలో సరికానిది", "o": ["తెనుంగు, తెనుఁగు – ఈ రెండు రూపాలను నన్నయ ప్రయోగించాడు.", "తెలంగ, తెలుగు – రూపాలను నన్నెచోడుడు ప్రయోగించాడు", "తెనుంగు, తెలుఁగు పదాలను పాల్కురికి సోమన భాషా పరంగా ప్రయోగించాడు", "తెలుంగు, తెలుగు రూపాలను నన్నయ ప్రయోగించలేదు."], "a": 1, "e": "నన్నెచోడుడు ప్రయోగించినవి 'తెనుగు' సంబంధ రూపాలే; 'తెలంగ, తెలుగు' రూపాలను ఆయన ప్రయోగించాడనడం సరికాదు. కాబట్టి రెండవ వాక్యం సరికానిది."}, {"q": "తెనుగు, తెలుగు పదాలతో పాటు ఆంధ్రశబ్దాన్ని కూడా భాషాపరంగా ప్రయోగించిన ‘ఆంధ్రభాషాభూషణ’ కర్త", "o": ["అనంతామాత్యుడు", "విన్నకోట పెద్దన", "అప్పకవి", "కేతన"], "a": 3, "e": "'ఆంధ్రభాషాభూషణము' రాసినది మూలఘటిక కేతన. ఇది తెలుగు భాషలో రాసిన తొలి తెలుగు వ్యాకరణ గ్రంథం; కేతన తిక్కనకు తన 'దశకుమార చరిత్ర'ను అంకితమిచ్చాడు."}, {"q": "‘తెలుగు’ త్రిలింగ శబ్దభవం కాదనీ, తెలుగు యొక్క సంస్కృతీకృత రూపమే త్రిలింగమని నిరూపించిన వారు", "o": ["చిలుకూరి వీరభద్రరావు", "కొమర్రాజు లక్ష్మణరావు", "చిలుకూరి నారాయణరావు", "నిడదవోలు వేంకటరావు"], "a": 1, "e": "కొమర్రాజు వేంకట లక్ష్మణరావు ఈ వాదనను నిరూపించారు — 'తెలుగు' నుంచే సంస్కృతీకరణ ద్వారా 'త్రిలింగ' ఏర్పడిందని, దానికి విరుద్ధంగా కాదని చూపారు."}, {"q": "భరతుడు నాట్యశాస్త్రంలో నాటకంలో ఉపయోగించదగిన విభాషలు ఇన్ని అని సూచించాడు", "o": ["6 విధములు", "9 విధములు", "7 విధములు", "8 విధములు"], "a": 2, "e": "భరతుడు నాట్యశాస్త్రంలో నాటకంలో వాడదగిన విభాషలు ఏడు విధాలని పేర్కొన్నాడు. భాషలు, విభాషల విభజన ద్వారా పాత్రోచిత భాషా ప్రయోగాన్ని నిర్దేశించాడు."}, {"q": "‘జనవాణి’ పత్రికద్వారా మొట్టమొదటిసారిగా వ్యావహారికాన్ని పత్రికా భాషగా చేసిన వారు", "o": ["పంచాగ్నుల ఆదినారాయణ శాస్త్రి", "తాపీ ధర్మారావు", "హూండ్ల రామకృష్ణయ్య", "పురాణ పండ మల్లయ్య శాస్త్రి"], "a": 1, "e": "తాపీ ధర్మారావు 'జనవాణి' పత్రికను పూర్తిగా వ్యావహారిక భాషలో నడిపి, పత్రికా భాషగా వ్యావహారికానికి మార్గం వేశారు."}, {"q": "‘ఆంధ్ర పండిత భిషక్కుల భాషా భేషజము’ అనే గ్రంథ రచయిత", "o": ["సెట్టి లక్ష్మీనరసింహం", "గిడుగు వేంకట రామమూర్తి", "కొక్కొండ వేంకటరత్నం పంతులు", "వేదం వేంకటరాయ శాస్త్రి"], "a": 1, "e": "గిడుగు వేంకట రామమూర్తి పంతులు ఈ గ్రంథాన్ని రాశారు. గ్రాంథిక పండితుల వాదనలను ఖండిస్తూ వ్యావహారిక భాషోద్యమాన్ని బలపరిచిన రచన ఇది."}, {"q": "గ్రాంథికాన్ని తీవ్రంగా నిరసిస్తూ శ్రీనివాసయ్యంగారు ప్రకటించిన కరపత్రం", "o": ["Life or Death – A Plea for vernaculars", "A Memorandum on Modern Telugu", "A Defense of Literary Telugu", "The Grahmya Controversy"], "a": 0, "e": "వ్యావహారిక భాషోద్యమ కాలంలో శ్రీనివాస అయ్యంగారు 'Life or Death – A Plea for vernaculars' అనే కరపత్రాన్ని ప్రకటించి, వ్యావహారిక భాష వాడకాన్ని బలంగా సమర్థించారు."}, {"q": "ఆమె జ్వరంతో పరీక్ష రాసింది. వాక్యంలో ‘తో’ ఈ అర్థంలో ప్రయుక్తమైంది", "o": ["కరణార్థం", "రీత్యర్థం", "కర్తృవిశేషణంగా", "సహార్థం"], "a": 2, "e": "ఇక్కడ 'జ్వరంతో' అన్నది పరీక్ష రాసిన కర్త (ఆమె) ఏ స్థితిలో ఉందో తెలుపుతోంది. కాబట్టి 'తో' ప్రత్యయం కర్తృవిశేషణంగా ప్రయోగించబడింది."}, {"q": "కొంత స్వరధర్మం, కొంత వ్యంజన ధర్మం ఉన్న వర్ణాలు", "o": ["అంతస్థాలు", "పార్శ్వికాలు", "అనునాసికాలు", "అచ్చులు"], "a": 0, "e": "య, ర, ల, వ అనే నాలుగు వర్ణాలను అంతస్థాలు అంటారు. ఇవి అచ్చులకు, హల్లులకు మధ్య ఉండేవి — కొంత స్వరధర్మం, కొంత వ్యంజన ధర్మం కలిగి ఉంటాయి."}, {"q": "కదా, కదూ వంటి అపదాలు వాక్యానికి చేర్చడం వల్ల ఈ రకమైన ప్రశ్నలు ఏర్పడతాయి", "o": ["వాక్యాంతశబ్దాపేక్షక ప్రశ్నలు", "వాక్యేతరశబ్దాపేక్షక ప్రశ్నలు", "విషయనిర్ధారక ప్రశ్నలు", "వాక్యాంతశబ్దేతర ప్రశ్నలు"], "a": 2, "e": "'కదా, కదూ' వంటివి వాక్యం చివర చేర్చినప్పుడు, చెప్పిన విషయం నిజమేనా అని నిర్ధారణ కోరే ప్రశ్నలు ఏర్పడతాయి. వీటిని విషయనిర్ధారక ప్రశ్నలు అంటారు."}]}, {"from": 61, "to": 90, "topic": "కావ్య నిర్వచనాలు, రస–ధ్వని, విమర్శ", "qs": [{"q": "‘మోట’ అనే అర్థంలో ‘కపిల’ శబ్దాన్ని ప్రయోగించిన కవి", "o": ["నన్నయ", "శ్రీనాథుడు", "తిక్కన", "పోతన"], "a": 2, "e": "తిక్కన తన భారతంలో నీరు తోడే 'మోట' అనే అర్థంలో 'కపిల' శబ్దాన్ని ప్రయోగించాడు. దేశీయ వ్యవసాయ పదాలను కావ్యభాషలోకి తేవడం తిక్కన శైలి లక్షణం."}, {"q": "కింద వాటిలో శిష్టోచ్చారణకు సంబంధించి సరికానిది", "o": ["ఒత్తులు నిలుస్తాయి", "పదాది వ కారం నిలుస్తుంది", "అద్విరుక్త చకారం అంతటా నిలుస్తుంది", "మూర్ధన్యాలు దంతమూలీయాలౌతాయి"], "a": 3, "e": "శిష్టోచ్చారణలో మూర్ధన్యాలు (ట, ఠ, డ, ఢ, ణ) మూర్ధన్యాలుగానే నిలుస్తాయి; అవి దంతమూలీయాలు కావు. కాబట్టి నాల్గవ వాక్యం సరికానిది."}, {"q": "ఒక మండలంలో మాత్రమే దేశ్యపదం మిగిలి, ఇతర మండలాల్లో అన్యదేశ్యం ఉంటే", "o": ["దేశ్యపదం ప్రాచీనం, అన్యదేశ్యం అర్వాచీనం అని గుర్తించాలి.", "దేశ్యపదం అర్వాచీనం, అన్యదేశ్యం ప్రాచీనం అని గుర్తించాలి.", "దేశ్యపదం, అన్యదేశ్యం రెండూ అర్వాచీనాలు అని గుర్తించాలి.", "దేశ్యపదం, అన్యదేశ్యం రెండు ప్రాచీనాలు అని గుర్తించాలి."], "a": 0, "e": "భాషాశాస్త్ర సూత్రం ప్రకారం పాత పదం అంచు ప్రాంతాల్లో (ఒక మండలంలో) మిగిలిపోతుంది; కొత్తగా వచ్చిన అన్యదేశ్య పదం మిగతా చోట్ల వ్యాపిస్తుంది. కాబట్టి దేశ్యపదం ప్రాచీనం, అన్యదేశ్యం అర్వాచీనం."}, {"q": "‘గోదాము’ పదం ఈ భాషనుండి తెలుగులోకి వచ్చింది", "o": ["పర్షియన్", "పోర్చుగీసు", "ఉర్దూ", "అరబిక్"], "a": 1, "e": "'గోదాము' పోర్చుగీసు భాష నుండి తెలుగులోకి వచ్చిన అన్యదేశ్య పదం. పోర్చుగీసు వారి వాణిజ్య సంబంధాల ద్వారా మేస్త్రీ, చావి, అల్మారా వంటి పదాలు కూడా వచ్చాయి."}, {"q": "‘యజమాని’ అనే అర్థాన్నిచ్చే ‘హకీమ్’ అనే పర్షియన్ పదం తెలుగులో", "o": ["అకీమ్", "ఎకిమీడు", "ఆకిమీడు", "అకిమీడు"], "a": 1, "e": "పర్షియన్ 'హకీమ్' తెలుగులో 'ఎకిమీడు' గా మారింది — అంటే యజమాని, పాలకుడు. అన్యదేశ్య పదాలు తెలుగు ధ్వని స్వభావానికి తగినట్లు మారడానికి ఇది ఉదాహరణ."}, {"q": "ఎరువు తెచ్చుకున్న పదాన్ని నిసర్గమైన పదంలాగా మార్చటమే", "o": ["సారూప్యపదం", "సభ్యోక్తి", "అర్థాపకర్ష", "లోకనిరుక్తి"], "a": 3, "e": "ఇతర భాషల నుండి వచ్చిన పదాన్ని ప్రజలు తమ భాషలోని సహజ పదంలా మార్చుకోవడాన్ని 'లోకనిరుక్తి' (Folk etymology) అంటారు."}, {"q": "కింది వాటిలో విశ్వనాథుని కావ్యనిర్వచనం", "o": ["గుణాలంకారం యుక్తార్థౌ కావ్యమ్", "వాక్యం రసాత్మకం కావ్యమ్", "విశ్వశ్రేయః కావ్యమ్", "రసేనైవ సర్వం జీవతి కావ్యమ్"], "a": 1, "e": "'వాక్యం రసాత్మకం కావ్యమ్' — రసంతో కూడిన వాక్యమే కావ్యమని విశ్వనాథుడు తన 'సాహిత్యదర్పణం'లో నిర్వచించాడు."}, {"q": "‘రమణీయార్థ ప్రతిపాదకశ్శబ్దః కావ్యమ్’ అని అన్నది", "o": ["మహిమ భట్టు", "అభినవగుప్తుడు", "వామనుడు", "జగన్నాథ పండితరాయలు"], "a": 3, "e": "జగన్నాథ పండితరాయలు తన 'రసగంగాధరం'లో ఈ నిర్వచనం ఇచ్చాడు — రమణీయమైన అర్థాన్ని తెలిపే శబ్దమే కావ్యం."}, {"q": "‘శబ్దార్థౌ సహితౌ కావ్యం’ అన్నది", "o": ["మమ్మటుడు", "భామహుడు", "వాగ్భటుడు", "దండి"], "a": 1, "e": "భామహుడు తన 'కావ్యాలంకారం'లో శబ్దం, అర్థం కలిసి ఉండడమే కావ్యమని నిర్వచించాడు."}, {"q": "ప్రతిభను ‘భావయిత్రి’, ‘కారయిత్రి’ అని కావ్యమీమాంసలో చెప్పినవారు.", "o": ["రాజశేఖరుడు", "పీయూషవర్షుడు", "విద్యాధరుడు", "కేశవమిత్రుడు"], "a": 0, "e": "రాజశేఖరుడు 'కావ్యమీమాంస'లో ప్రతిభను రెండుగా విభజించాడు — కావ్యం సృష్టించే కారయిత్రి ప్రతిభ, కావ్యాన్ని ఆస్వాదించే భావయిత్రి ప్రతిభ."}, {"q": "కావ్య హేతువులలో రాజశేఖరుడు దీనికి ప్రాధాన్యము నిచ్చారు", "o": ["వ్యుత్పత్తి", "అభ్యాసము", "ప్రతిభ", "ప్రతిభ, వ్యుత్పత్తి, అభ్యాసములకు సమప్రాధాన్యం"], "a": 2, "e": "కావ్య హేతువులు మూడు — ప్రతిభ, వ్యుత్పత్తి, అభ్యాసం. వీటిలో రాజశేఖరుడు ప్రతిభకే అగ్రస్థానం ఇచ్చాడు; ప్రతిభ లేనిదే కావ్యం పుట్టదని అభిప్రాయం."}, {"passage": "“కవిత్వమెల్ల వస్తువులను సుందరమొనర్చును. సుందర వస్తువులను సుందరతరము లొనర్చును. వైరూప్యములను కూడా సుందరముగా మార్చును”", "q": "అని అన్నది.", "o": ["కీట్స్", "షెల్లీ", "లేహంట్", "కార్లైల్"], "a": 1, "e": "ఆంగ్ల కవి షెల్లీ 'A Defence of Poetry'లో చెప్పిన మాట ఇది — కవిత్వం వికారమైన వాటిని కూడా అందంగా మారుస్తుంది."}, {"q": "అద్భుత రసమునకు స్థాయి భావము", "o": ["శమము", "క్రోధము", "విస్మయము", "ఉత్సాహము"], "a": 2, "e": "అద్భుత రసానికి స్థాయీభావం 'విస్మయం' (ఆశ్చర్యం). శమం శాంత రసానికి, క్రోధం రౌద్ర రసానికి, ఉత్సాహం వీర రసానికి స్థాయీభావాలు."}, {"q": "“శృంగార ఏవ ఏకోరసః” అని సిద్ధాంతీకరించిన వారు", "o": ["భవభూతి", "భానుదత్తుడు", "రూపగోస్వామి", "భోజుడు"], "a": 3, "e": "భోజుడు తన 'శృంగార ప్రకాశం'లో శృంగారమే ఏకైక రసమని, మిగిలిన రసాలన్నీ దానిలో భాగమేనని సిద్ధాంతీకరించాడు."}, {"q": "కింది వాటిలో సరికానిది", "o": ["భరతుడు ఎనిమిది రసములను పేర్కొన్నాడు", "భట్టోద్భటుడు తొమ్మిది రసములను పేర్కొన్నాడు", "రుద్రటుడు పదవరసము మాయారసము అని ప్రతిపాదించాడు.", "రూపగోస్వామి మధుసూదన సరస్వతి భక్తిని రసముగా పేర్కొన్నారు."], "a": 2, "e": "రుద్రటుడు తొమ్మిది రసాలకు అదనంగా 'ప్రేయస్' (ప్రేయో రసం) ను పదవ రసంగా చెప్పాడు; 'మాయారసం' అనడం సరికాదు. భరతుడు ఎనిమిది, భట్టోద్భటుడు శాంతంతో కలిపి తొమ్మిది రసాలు పేర్కొన్నారు."}, {"q": "ధ్వని సిద్ధాంతమును ప్రతిపాదించిన వారు", "o": ["కుంతకుడు", "భామహుడు", "క్షేమేంద్రుడు", "ఆనందవర్ధనుడు"], "a": 3, "e": "ఆనందవర్ధనుడు 'ధ్వన్యాలోకం' గ్రంథంలో ధ్వని సిద్ధాంతాన్ని ప్రతిపాదించాడు. కుంతకుడిది వక్రోక్తి, క్షేమేంద్రుడిది ఔచిత్య సిద్ధాంతం."}, {"q": "‘ధ్వని సిద్ధాంతమును’ ఖండిస్తూ మహిమభట్టు రచించిన గ్రంథం", "o": ["కావ్యానుశాసనము", "అలంకారశేఖరము", "వ్యక్తివివేకము", "హృదయదర్పణము"], "a": 2, "e": "మహిమభట్టు 'వ్యక్తివివేకం' గ్రంథంలో ధ్వని సిద్ధాంతాన్ని ఖండించి, ధ్వని అనేది అనుమానంలోనే అంతర్భవిస్తుందని వాదించాడు."}, {"q": "కింది వాటిలో సరికానిది", "o": ["ఆనందవర్ధనుని మతమున ‘ధ్వని’ కావ్యమునకు ఆత్మ", "ఆనందవర్ధనుని గ్రంథము ధ్వన్యాలోకము.", "ఆనందవర్ధనుడు ధ్వనిని వస్తుధ్వని, అలంకారధ్వని, రసధ్వని అని విభజించాడు.", "ఆనందవర్ధనుడు వస్తుధ్వని ఉత్తమోత్తమమని చెప్పాడు."], "a": 3, "e": "ఆనందవర్ధనుడు మూడు ధ్వనుల్లో రసధ్వనినే ఉత్తమోత్తమమని చెప్పాడు, వస్తుధ్వనిని కాదు. కాబట్టి నాల్గవ వాక్యం సరికానిది."}, {"q": "“Poetry is the interpretation of life” అని అన్నవారు", "o": ["ఆంద్రే", "కీట్సు", "మాథ్యూ ఆర్నాల్డ్", "ఫ్రాన్సిస్ బేకన్"], "a": 2, "e": "ఆంగ్ల విమర్శకుడు మాథ్యూ ఆర్నాల్డ్ మాట ఇది — కవిత్వం జీవిత వ్యాఖ్యానమని ఆయన అభిప్రాయం."}, {"q": "‘ఉత్తమోత్తమ శబ్దములు రీతి సుభగముగు శయ్యతో గ్రథించుటయే కవిత’ అని చెప్పిన వారు.", "o": ["కార్లైల్", "కోల్ రిడ్జి", "మెకాలే", "రస్కిన్"], "a": 1, "e": "కోల్‌రిడ్జ్ కవిత్వాన్ని 'best words in the best order' అని నిర్వచించాడు. ఉత్తమ శబ్దాలను ఉత్తమ క్రమంలో అమర్చడమే కవిత అని అర్థం."}, {"passage": "“కవిత్వము ఛందోబద్ధమగు రచన. అది బుద్ధియు భావనయు సాధనములుగా ఆనంద సత్యములయొక్యమును సంఘటించు కళ”", "q": "అని అన్నవారు", "o": ["జాన్సన్", "జాన్ స్టూవర్ట్ మిల్", "మాథ్యూ ఆర్నాల్డ్", "ఆంద్రే"], "a": 0, "e": "ఆంగ్ల విమర్శకుడు డాక్టర్ శామ్యూల్ జాన్సన్ ఇచ్చిన కవిత్వ నిర్వచనం ఇది — ఛందస్సుతో కూడిన రచన ద్వారా సత్యాన్ని, ఆనందాన్ని కలపడమే కవిత్వం."}, {"q": "శ్రీశ్రీ మహాప్రస్థానానికి పీఠిక రాసిన వారు", "o": ["ముద్దుకృష్ణ", "జి. లక్ష్మీ నరసయ్య", "చలం", "రాచమల్లు రామ చంద్రారెడ్డి"], "a": 2, "e": "'మహాప్రస్థానం'కు 'యోగ్యతా పత్రం' పేరుతో పీఠిక రాసినది గుడిపాటి వెంకట చలం. ఈ ముందుమాట తెలుగు సాహిత్యంలో అత్యంత ప్రసిద్ధమైనది."}, {"q": "‘విమర్శ మౌలిక లక్షణాలు’ గ్రంథ రచయిత", "o": ["ముదిగొండ వీరభద్రయ్య", "కోరాడ రామకృష్ణయ్య", "కె. కె. రంగనాథాచార్యులు", "జి. లక్ష్మీనరసయ్య"], "a": 0, "e": "'విమర్శ మౌలిక లక్షణాలు' గ్రంథ రచయిత ముదిగొండ వీరభద్రయ్య. తెలుగు విమర్శ శాస్త్ర గ్రంథాల్లో ఇది ప్రముఖమైనది."}, {"q": "‘ఆంధ్ర సాహిత్య విమర్శ – ఆంగ్లప్రభావం’ గ్రంథ రచయిత", "o": ["కోవెల సంపత్కుమారాచార్య", "కోవెల సుప్రసన్నాచార్య", "ఆర్. ఎస్. సుదర్శనం", "జి. వి. సుబ్రహ్మణ్యం"], "a": 3, "e": "'ఆంధ్ర సాహిత్య విమర్శ – ఆంగ్ల ప్రభావం' రాసినది జి. వి. సుబ్రహ్మణ్యం. తెలుగు విమర్శపై ఆంగ్ల సాహిత్య ప్రభావాన్ని విశ్లేషించిన పరిశోధన గ్రంథం ఇది."}, {"q": "ద్రుతప్రకృతులు గాని శబ్దములు", "o": ["ద్రుతంబులు", "కళలనంబడు", "ద్రుతలోపంబులు", "స్థిరంబులు"], "a": 1, "e": "బాలవ్యాకరణ సంజ్ఞా పరిచ్ఛేదం ప్రకారం ద్రుతం చివర లేని శబ్దా ", "జడములు"], "a": 2, "e": "స్త్రీలు, తిర్యక్కులు (జంతువులు), జడపదార్థాలు కానివి — అంటే పురుషులు, దేవతలు మొదలైనవి — వాటిని, వాటి విశేషణాలను 'మహత్తులు' అంటారు. మిగిలినవి అమహత్తులు."}, {"q": "తే ప్రభృతుల బహువచనమునకుముందు", "o": ["డుజ్జగు", "ముపర్ణంబగు", "రువర్ణంబగు", "డకారంబగు"], "a": 0, "e": "'తే' మొదలైన శబ్దాల బహువచనానికి ముందు 'డు' ప్రత్యయం వస్తుంది (డుజ్జగు). ఇది బాలవ్యాకరణ సంబోధన/ప్రత్యయ సూత్రాల్లోనిది."}, {"q": "ఇయుకు మాఱుగా నామాంతంబున కెత్వంబు ........ గా నగు", "o": ["విభాష", "బహుళంబు", "నిత్యంబు", "నిషేధంబు"], "a": 1, "e": "నామం చివర 'ఇ' కి బదులు 'ఎ' రావడం బహుళంగా జరుగుతుంది — అంటే కొన్ని చోట్ల జరుగుతుంది, కొన్ని చోట్ల జరగదు."}, {"q": "పగతాదుల బహువచన లకారంబునకు ...............", "o": ["కకారంబగు", "రేఫంబగు", "ళకారంబగు", "అలిగాగమంబగు"], "a": 1, "e": "'పగతు' మొదలైన శబ్దాల బహువచనంలోని 'ల' కారం 'ర' (రేఫం) గా మారుతుంది. ఉదా: పగతురు."}, {"q": "జీవన వైవిధ్యం ఇతివృత్తంగా ఉన్న పాఠం", "o": ["తృప్తి", "ఎంతమంచివారమ్మా!", "దూడూ బసవన్న", "మేలుకొలుపు"], "a": 1, "e": "'ఎంతమంచివారమ్మా!' పాఠం జీవితంలోని వివిధ రకాల మనుషులను, జీవన వైవిధ్యాన్ని చిత్రిస్తుంది."}, {"q": "‘చేజారిన బాల్యం’ పాఠం ఇతివృత్తం", "o": ["వ్యక్తిత్వ వికాసం", "జీవన నైపుణ్యం", "కుటుంబ విలువలు", "ఆధునికవిద్య ఆవశ్యకత"], "a": 0, "e": "'చేజారిన బాల్యం' పాఠం బాల్యంలో కోల్పోయిన అనుభవాల ద్వారా వ్యక్తిత్వ వికాసం ప్రాముఖ్యాన్ని తెలుపుతుంది."}, {"q": "‘చైతన్యం’ పాఠం ఇతివృత్తం", "o": ["స్వయంకృషి", "పరోపకారం", "దేశభక్తి", "సామాజిక బాధ్యత"], "a": 3, "e": "'చైతన్యం' పాఠం సమాజం పట్ల ప్రతి వ్యక్తికి ఉండవలసిన బాధ్యతను, చైతన్యాన్ని ఇతివృత్తంగా తీసుకుంది."}, {"q": "కింది పాఠాలలో కథానిక ప్రక్రియ", "o": ["తీర్పు", "ఆత్మకథ", "ఇల్లలకగానే", "నా చదువు"], "a": 2, "e": "'ఇల్లలకగానే' కథానిక ప్రక్రియకు చెందినది. 'ఆత్మకథ', 'నా చదువు' స్వీయచరిత్ర ప్రక్రియలు."}, {"q": "‘మాయాకంబళి’ పాఠం ప్రక్రియ", "o": ["గల్పిక", "వ్యాసం", "జానపదకథ", "గేయం"], "a": 2, "e": "'మాయాకంబళి' జానపద కథ ప్రక్రియకు చెందినది. ప్రజల నోళ్లలో తరతరాలుగా నడిచిన కథను పాఠంగా చేర్చారు."}, {"q": "అతిథిగౌరవం ఇతివృత్తంగా కలిగిన ‘ఆతిథ్యం’ పాఠం ప్రక్రియ", "o": ["ఇతిహాసం", "కథ", "ఆత్మకథ", "సాహితీరూపకం"], "a": 0, "e": "'ఆతిథ్యం' పాఠం ఇతిహాసం (మహాభారతం) నుండి స్వీకరించిన భాగం. అతిథి గౌరవ ప్రాధాన్యాన్ని ఇతిహాస కథ ద్వారా తెలుపుతుంది."}, {"q": "ఎవరి కాలమును ‘ప్రబంధయుగము’ అని అంటారు?", "o": ["రాజరాజనరేంద్రుడు", "శ్రీకృష్ణదేవరాయలు", "మనుమసిద్ధి", "ప్రోలయవేమారెడ్డి"], "a": 1, "e": "శ్రీకృష్ణదేవరాయల కాలాన్ని (16వ శతాబ్దం) ప్రబంధయుగం అంటారు. ఈ కాలంలోనే అష్టదిగ్గజ కవులు మనుచరిత్ర, పారిజాతాపహరణం వంటి ప్రబంధాలు రచించారు."}, {"q": "‘నా అనుభవం నేర్పిన పాఠమే నా కవిత్వం’ అని ‘ఆత్మకథ’ పాఠంలో తన కవితా గుణాల్ని ప్రకటించిన నవయుగ వచన కవితా చక్రవర్తి", "o": ["ఆశావాది ప్రకాశరావు", "ఎండ్లూరి సుధాకర్", "డేవిడ్ లివింగ్ స్టన్", "రావినూతల ప్రేమ కిషోర్"], "a": 1, "e": "ఎండ్లూరి సుధాకర్ ఆధునిక దళిత కవిత్వంలో ప్రముఖులు. తన జీవితానుభవమే తన కవిత్వానికి మూలమని 'ఆత్మకథ' పాఠంలో ప్రకటించారు."}, {"q": "“మనిషి మాలిన్యాన్ని ఇన్ని నులివెచ్చని కన్నీళ్ళతో కడిగి శుభ్రం చేయలేకపోయాం ...!” అని చిరమాలిన్యం పాఠంలో వాపోయిన కవి", "o": ["పవని నిర్మల ప్రభావతి", "నేతల ప్రతాప్ కుమార్", "మూలింటి చంద్రకళ", "షేక్ ఖాజా హుస్సేన్"], "a": 3, "e": "'చిరమాలిన్యం' కవితలో షేక్ ఖాజా హుస్సేన్ మనుషుల మనసుల్లోని మాలిన్యాన్ని కడగలేకపోయామని ఆవేదన వ్యక్తం చేశారు."}, {"q": "కౌశికుని గాథను ధర్మరాజుతో చెప్పినది", "o": ["మార్కండేయ మహర్షి", "నారదుడు", "బ్రహ్మ", "వాల్మీకి"], "a": 0, "e": "అరణ్యపర్వంలో మార్కండేయ మహర్షి ధర్మరాజుకు కౌశికుని కథను చెప్పాడు. ఈ కథ ద్వారా ధర్మ సూక్ష్మాలను, మాతృపితృ సేవ గొప్పతనాన్ని వివరించాడు."}, {"q": "విశ్వామిత్రుడు, మేనకలకు జన్మించిన కుమార్తెను కాపాడిన పక్షులు", "o": ["శాలివాహ పక్షులు", "గండభేరుండ పక్షులు", "శకుంత జాతి పక్షులు", "చకోర పక్షులు"], "a": 2, "e": "విశ్వామిత్ర–మేనకల కుమార్తెను అడవిలో శకుంత జాతి పక్షులు కాపాడాయి. అందుకే ఆమెకు 'శకుంతల' అనే పేరు వచ్చింది."}, {"q": "కన్యాశుల్కం నాటకంలో వెంకమ్మ, అగ్నిహోత్రావధానుల పెద్దకూతురు", "o": ["అచ్చమ్మ", "బుచ్చమ్మ", "సుబ్బి", "లచ్చి"], "a": 1, "e": "గురజాడ 'కన్యాశుల్కం'లో అగ్నిహోత్రావధానులు–వెంకమ్మల పెద్దకూతురు బుచ్చమ్మ — బాల వితంతువు. చిన్నకూతురు సుబ్బి."}, {"q": "“నీ పౌరుషం బొంగరాలాటలో కాదు. యుద్ధభూమిలో చూపించు, పల్నాటి వీరత్వాన్ని ప్రదర్శించు” అని ఎవ , "o": ["దాతలవలన గొప్పదానాలు చేయబడుతున్నాయి.", "దాతలచేత గొప్పదానాలు చేయబడుతున్నాయి.", "దాతలచేత గొప్పదానాలు చేయుచున్నాయి.", "దాతలచేత గొప్పదానాలు చేయబడెను."], "a": 1, "e": "కర్మణి వాక్యంలో కర్తకు 'చేత' ప్రత్యయం, క్రియకు 'బడు' ప్రత్యయం చేరతాయి, కాలం మారకూడదు. కాబట్టి 'దాతలచేత గొప్పదానాలు చేయబడుతున్నాయి' సరైనది."}, {"q": "బులుసు వేంకట రమణయ్య ఉత్తరదేశయాత్ర గ్రంథాన్ని రాశారు. దీనికి సరైన కర్మణి వాక్యం", "o": ["బులుసు వేంకట రమణయ్య ఉత్తరదేశయాత్ర గ్రంథం రచించబడెను.", "బులుసు వేంకట రమణయ్య చేత ఉత్తరదేశ యాత్ర గ్రంథం రాశారు.", "బులుసు వేంకట రమణయ్య చేత ఉత్తర దేశ యాత్ర గ్రంథం రాయబడింది.", "బులు వేంకట రమణయ్య చేత ఉత్తరదేశ యాత్ర గ్రంథాన్ని రాయించెను."], "a": 2, "e": "కర్త + 'చేత', క్రియ + 'బడు', భూతకాలం అలాగే ఉండాలి. కాబట్టి 'బులుసు వేంకట రమణయ్య చేత ఉత్తర దేశ యాత్ర గ్రంథం రాయబడింది' సరైన కర్మణి వాక్యం."}, {"q": "చెట్లచేత ప్రాణవాయువు అందించబడుతోంది. దీనికి సరైన కర్తరి వాక్యం", "o": ["చెట్లు ప్రాణవాయువును అందిస్తున్నాయి", "చెట్లచే ప్రాణవాయువు అందిస్తున్నాయి", "చెట్లు ప్రాణవాయువును అందించవు", "చెట్లచే ప్రాణవాయువు అందుతున్నాయి"], "a": 0, "e": "కర్తరి వాక్యంలో కర్త ప్రథమా విభక్తిలో ఉండి, క్రియను నేరుగా చేస్తుంది. కాబట్టి 'చెట్లు ప్రాణవాయువును అందిస్తున్నాయి' సరైనది."}, {"q": "“నువ్వింకా చిన్నపిల్లవాడివి” అని అనుకుంటున్నావా? పరోక్ష కథనం గుర్తించండి.", "o": ["నువ్వింకా చిన్న పిల్లాడివి కాదుఅనుకుంటున్నావా?", "నువ్వింకా చిన్న పిల్లాడివని అనుకుంటున్నావా?", "నువ్వింకా పిల్లాడివేమోనని అనుకుంటున్నావా?", "నువ్వింకా పెద్ద పిల్లాడివి అనుకుంటున్నావా?"], "a": 1, "e": "పరోక్ష కథనంలో కొటేషన్ గుర్తులు తొలగి 'అని/అని' స్థానంలో 'అని' కలిసిపోతుంది. 'చిన్న పిల్లాడివి' + అని = 'చిన్న పిల్లాడివని' — అర్థం మారకుండా ఉంటుంది."}, {"q": "వ్యక్తికి బహువచనం శక్తని అన్నాడు శ్రీ శ్రీ. దీనికి సరైన ప్రత్యక్షకథనం", "o": ["“వ్యక్తికి బహువచనం శక్తి” అని అన్నాడు శ్రీ శ్రీ.", "“వ్యక్తికి బహువచనం శక్తి” అనలేదు శ్రీ శ్రీ.", "“వ్యక్తికి బహువచనం శక్తి” శ్రీశ్రీ అనియుండ లేదు.", "“వ్యక్తికి బహువచనం శక్తి” అనెను ఆరుద్ర."], "a": 0, "e": "ప్రత్యక్ష కథనంలో వక్త మాటలను యథాతథంగా కొటేషన్ గుర్తుల్లో ఉంచి 'అని అన్నాడు' చేర్చాలి. కాబట్టి మొదటిది సరైనది."}, {"q": "“మీరంతా ఎక్కడినుండి వస్తున్నారు” అని శైలజ పిల్లల్ని అడిగింది. దీనికి సరైన పరోక్షకథనం", "o": ["“మీరంతా ఎక్కడి నుండి వస్తున్నారు” శైలజ పిల్లల్ని అడిగింది.", "మీరంతా ఎక్కడికి వెళ్ళారని శైలజ పిల్లల్ని అడిగింది.", "మీరంతా ఎక్కడినుండి వస్తున్నారని శైలజ పిల్లల్ని అడిగింది.", "మీరంతా ఎక్కడి నుండి వస్తారని శైలజ పిల్లల్ని అడిగింది."], "a": 2, "e": "పరోక్ష కథనంలో కొటేషన్ తొలగి, క్రియకు 'అని' చేరుతుంది; కాలం, అర్థం మారకూడదు. 'వస్తున్నారు' + అని = 'వస్తున్నారని'."}, {"q": "ఆటవెలది పద్యంలో యతి స్థానం", "o": ["ప్రతిపాదంలో నాల్గవగణం మొదటి అక్షరం", "ప్రతిపాదంలో మూడవగణం మొదటి అక్షరం", "ప్రతిపాదంలో ఐదవగణం మొదటి అక్షరం", "ప్రతిపాదంలో రెండవగణం మొదటి అక్షరం"], "a": 0, "e": "ఆటవెలది పద్యంలో ప్రతి పాదంలోనూ నాల్గవ గణం మొదటి అక్షరం యతి స్థానం. తేటగీతిలో కూడా యతి నాల్గవ గణం మొదటి అక్షరమే."}, {"q": "సీసపద్యంలోని పాదాల సంఖ్య", "o": ["ఐదు", "ఆరు", "నాలుగు", "ఏడు"], "a": 2, "e": "సీస పద్యానికి నాలుగు పాదాలు. ప్రతి పాదంలో ఆరు ఇంద్రగణాలు, రెండు సూర్యగణాలు ఉంటాయి; చివర ఆటవెలది లేదా తేటగీతి ఎత్తుగీతిగా వస్తుంది."}, {"passage": "కంజనయన భవభీతివి\nభంజన శుకశౌనకాది బహుమునిచేతో", "q": "ఈ పద్యపాదాలలోని ప్రాస", "o": ["ద్వంద్వప్రాసము", "త్రిప్రాసము", "చతుష్ప్రాసము", "దుష్కరప్రాసము"], "a": 0, "e": "రెండు పాదాల్లోనూ రెండవ అక్షరం స్థానంలో సంయుక్తాక్షరం (ంజ / ంజ) ఒకే రీతిలో వచ్చింది. ఇలా జంటగా వచ్చే ప్రాసను ద్వంద్వప్రాసం అంటారు."}, {"q": "ఒక వస్తువునే అనేకులు అనేక విధంగా చెప్పిన ఆ అలంకారం", "o": ["పరిణామాలంకారం", "ఉల్లేఖాలంకారం", "ప్రతీపాలంకారం", "ఉపమాలంకారం"], "a": 1, "e": "ఒకే వస్తువును పలువురు పలు విధాలుగా వర్ణించడాన్ని 'ఉల్లేఖాలంకారం' అంటారు. ఉదా: ఒకే రాజును భటుడు వీరుడిగా, కవి దాతగా చూడటం."}, {"q": "“ఏనుగు మదము చేతను, రాజు ప్రతాపము చేతను ప్రకాశించును” ఇందు అలంకారము", "o": ["పరికరాలంకారం", "దృష్టాంతాలంకారం", "ఉపమాలంకారం", "దీపకాలంకారం"], "a": 3, "e": "రెండు వేర్వేరు విషయాలకు ఒకే క్రియాపదం (ప్రకాశించును) దీపంలా వెలుగునిస్తూ ఉమ్మడిగా వర్తించడాన్ని 'దీపకాలంకారం' అంటారు."}, {"q": "వాక్యములకు బింబ ప్రతిబింబత్వమున్నట్లైతే అది ఈ అలంకారం", "o": ["తుల్యయోగితాలంకారం", "నిదర్శనాలంకారం", "దృష్టాంతాలంకారం", "అనన్వయాలంకారం"], "a": 2, "e": "రెండు వాక్యాల మధ్య బింబ–ప్రతిబింబ భావం ఉంటే అది దృష్టాంతాలంకారం. ఒక విషయాన్ని మరో ఉదాహరణతో ప్రతిబింబింపజేయడం దీని లక్షణం."}, {"q": "కింది వాటిలో వ్యావహారిక భాష లక్షణం కానిది", "o": ["లిఖిత భాష, మౌఖిక భాషకు దగ్గరగా ఉండటం", "అన్యభాషా పదాలను తనలో సమ్మేళనం చేసుకోవడం", "సరళమైన వ్యాకరణం ఉండటం", "సంస్కృత పదాలను విరివిగా వాడటం"], "a": 3, "e": "సంస్కృత పదాలను విరివిగా వాడటం గ్రాంథిక భాష లక్షణం. వ్యావహారిక భాష సరళంగా, మాట్లాడే భాషకు దగ్గరగా ఉంటుంది."}, {"q": "“వివిధ భాషణ అలవాట్లలో కూడిన సంక్లిష్ట వ్యవస్థే భాష” అన్నది", "o": ["హాకెట్", "స్టర్ట్‌వర్డ్", "ఎమ్మెన్ బాక్", "జాన్. పి. హ్యూగ్స్"], "a": 0, "e": "భాషాశాస్త్రవేత్త చార్లెస్ హాకెట్ ఇచ్చిన భాషా నిర్వచనం ఇది — భాష అనేది భాషణ అలవాట్ల సంక్లిష్ట వ్యవస్థ."}, {"q": "“ఇంట్రడక్షన్ టు ట్రాన్స్ ఫర్ మేషనల్ గ్రామర్” గ్రంథ రచయిత", "o": ["హాకెట్", "ఎమ్మెన్ బాక్", "నోమ్ చామ్‌స్కీ", "సైమన్ పాటర్"], "a": 1, "e": "'Introduction to Transformational Grammar' గ్రంథ రచయిత ఎమ్మన్ బాక్. పరివర్తన వ్యాకరణ సిద్ధాంతాన్ని ప్రతిపాదించినది మాత్రం నోమ్ చామ్‌స్కీ."}, {"q": "‘సూచిత ఇతివృత్తం ఆధారంగా కథలు అల్లడం’ ఈ సామర్థ్యం", "o": ["పదజాలం", "ప్రశంసాపూర్వక సున్నితత్వం", "సృజనాత్మక వ్యక్తీకరణం", "వినడం – అర్థం చేసుకోవడం, ప్రతిస్పందించడం"], "a": 2, "e": "ఇచ్చిన ఇతివృత్తం ఆధారంగా తనదైన కథను అల్లడం విద్యార్థి ఊహాశక్తిని, సొంత భావ ప్రకటనను చూపుతుంది — ఇది సృజనాత్మక వ్యక్తీకరణ సామర్థ్యం."}, {"q": "విద్యావ్యవస్థ సాధించవలసిన అంతిమధ్యేయాలుగా నిర్ణయించిన అంశాలు", "o": ["ఉద్దేశాలు", "గమ్యాలు", "లక్ష్యాలు", "స్పష్టీకరణలు"], "a": 1, "e": "గమ్యాలు (Aims) అనేవి విద్యావ్యవస్థ సుదీర్ఘ కాలంలో సాధించాలనుకునే అంతిమ ధ్యేయాలు. లక్ష్యాలు, స్పష్టీకరణలు వీటికి దిగువ స్థాయివి."}, {"q": "కింది వాటిలో సరికానిది", "o": ["పాఠశాల కార్యక్రమాల ద్వారా సాధించగలిగేవి ఉద్దేశ్యాలు.", "ఒక లక్ష్యాన్ని విశదీకరించే నిర్దిష్టమైన సూక్ష్మరూపం స్పష్టీకరణ.", "గమ్యాలు విద్యాప్రణాళికల రూపకల్పనను నిర్ణయిస్తాయి.", "స్పష్టమైన కొలవదగిన లక్ష్యాలను గమ్యాలు అంటారు."], "a": 3, "e": "స్పష్టమైన, కొలవదగినవి లక్ష్యాలు/స్పష్టీకరణలు — గమ్యాలు కాదు. గమ్యాలు విస్తృతమైనవి, నేరుగా టల ద్వారా చిన్నారుల విద్య ఈ పద్ధతి సారాంశం."}, {"q": "‘క్రీడాపద్ధతి’ ప్రయోజనం కానిది", "o": ["విద్యార్థుల్లో సృజనాత్మక శక్తి పెంపొందుతుంది.", "తరగతి గదిలో క్రమశిక్షణ కొరవడుతుంది.", "విద్యార్థుల్లో భావనాశక్తి పెంపొందుతుంది.", "శారీరక, మానసిక వికాసానికి ఉపకరిస్తుంది."], "a": 1, "e": "క్రమశిక్షణ కొరవడటం అనేది ప్రయోజనం కాదు — అది క్రీడా పద్ధతి లోపం. మిగిలిన మూడూ ప్రయోజనాలే."}, {"q": "“వ్యక్తి ఎలాంటి ఒత్తిడి లేకుండా, ఇష్టపూర్వకంగా ఉల్లాసంగా నిర్వహించే ఏ కృత్యమైనా క్రీడే అవుతుంది” అని అన్నవారు", "o": ["కారల్ గూస్", "గలిక్", "పెర్సీనన్", "S. K. వర్మ"], "a": 1, "e": "గలిక్ ఇచ్చిన క్రీడ నిర్వచనం ఇది — ఒత్తిడి లేకుండా ఇష్టపూర్వకంగా, ఉల్లాసంగా చేసే కృత్యమే క్రీడ."}, {"q": "డాల్టన్ పద్ధతికి మరొక పేరు", "o": ["ఉద్యమ పద్ధతి", "వ్యష్టి పద్ధతి", "సమస్యా పరిష్కార పద్ధతి", "శాస్త్రీయ పద్ధతి"], "a": 1, "e": "హెలెన్ పార్క్‌హర్స్ట్ ప్రవేశపెట్టిన డాల్టన్ పద్ధతిలో ప్రతి విద్యార్థి తన వేగానికి తగినట్లు స్వతంత్రంగా నేర్చుకుంటాడు. అందుకే దీన్ని వ్యష్టి (వ్యక్తిగత) పద్ధతి అంటారు."}, {"q": "‘చిన్న చిన్న సోపానాలతో, క్రమపద్ధతిలో నిర్వహించబడే స్వయం శిక్షణ కార్యక్రమమును’ ఇలా అంటారు.", "o": ["పర్యవేక్షణాత్మక అధ్యయనం", "నాటకీకరణ పద్ధతి", "ఎత్తుగడ పద్ధతి", "కార్యక్రమయుత బోధన"], "a": 3, "e": "విషయాన్ని చిన్న చిన్న సోపానాలుగా (frames) విభజించి, విద్యార్థి తనంతట తానే క్రమంగా నేర్చుకునేలా చేసే పద్ధతి కార్యక్రమయుత బోధన (Programmed Instruction)."}, {"q": "“పాఠశాలలోకి ప్రవేశించిన ఒక జీవన విధానం ప్రాజెక్టుపద్ధతి” అన్న వారు", "o": ["కిల్ ప్యాట్రిక్", "స్టీవెన్ సన్", "డేవిడ్ హార్స్ బర్గ్", "బల్లార్డ్"], "a": 3, "e": "ఈ నిర్వచనం ఇచ్చినది బల్లార్డ్. ప్రాజెక్టు పద్ధతిని అభివృద్ధి చేసినది కిల్‌ప్యాట్రిక్; దాని మూలం జాన్ డ్యూయీ తత్త్వం."}, {"q": "పాఠశాల ప్రాంగణంలోగాని వెలుపలగాని విద్యార్థులు, సంఘాలు, నిర్వహణ సంస్థల సహకారంతో నిర్వహించే కార్యక్రమాలు", "o": ["సహపాఠ్య కార్యక్రమాలు", "సౌందర్యాత్మక కార్యక్రమాలు", "నిర్మాణాత్మక కార్యక్రమాలు", "ఆచరణాత్మక కార్యక్రమాలు"], "a": 0, "e": "పాఠ్య బోధనకు అనుబంధంగా, లోపల లేదా బయట నిర్వహించే కార్యక్రమాలను సహపాఠ్య కార్యక్రమాలు (Co-curricular activities) అంటారు."}, {"q": "సహపాఠ్య కార్యక్రమాలకు సంబంధించి సరికానిది", "o": ["ఇవి వైయక్తిక కార్యక్రమాలు, బృందకార్యక్రమాలు అని రెండు రకాలు.", "కథచెప్పడం, వ్యాసం రాయడం వంటివి వైయక్తిక కార్యక్రమాలు.", "సభలు నిర్వహించడం, వార్షికోత్సవాల నిర్వహణ వంటివి బృందకార్యక్రమాలు.", "రచన, వక్తృత్వం, సారస్వత సంఘాలు వంటివి వీటిలో అంతర్భాగం కాదు."], "a": 3, "e": "రచన, వక్తృత్వం, సారస్వత సంఘాలు అన్నీ సహపాఠ్య కార్యక్రమాల్లో భాగమే. కాబట్టి నాల్గవ వాక్యం సరికానిది."}, {"q": "సహపాఠ్య కార్యక్రమాలకు సంబంధించి కింది వాటిలో సరికానిది", "o": ["ఇవి తరగతి బోధనాభ్యసన కార్యక్రమాలను అనుసరించి ఉండాలి.", "ఇవి విద్యాలక్ష్యాలకు ఆటంకాలు కల్పించకూడదు.", "ఇవి విద్యార్థుల సాంఘికీకరణకు, ఉద్వేగాల ప్రదర్శనకు సహకరించవు.", "ఇవి విద్యార్థుల భాషానైపుణ్యాల పటిష్ఠతకు ఉపకరిస్తాయి."], "a": 2, "e": "సహపాఠ్య కార్యక్రమాలు విద్యార్థుల సాంఘికీకరణకు, ఉద్వేగ ప్రకటనకు బాగా సహకరిస్తాయి. 'సహకరించవు' అనడం సరికాదు."}, {"q": "వాక్యాలలో కర్త, కర్మ, క్రియలను గుర్తించమనడం, వాక్యాంతరీకరణ వంటివి", "o": ["పదబంధ ప్రహేళికలు", "పదక్రీడలు", "వాక్యనిర్మాణక్రీడలు", "కథాపూరణలు"], "a": 2, "e": "వాక్య నిర్మాణానికి సంబంధించిన అంశాలను ఆటల రూపంలో నేర్పడాన్ని వాక్యనిర్మాణ క్రీడలు అంటారు."}, {"q": "ఒక అంశాన్ని కేంద్రీకృతం చేసుకొని లిఖిత రహితంగా మాట్లాడే విధానం", "o": ["ఉక్తరచన", "ఉక్తలేఖనం", "దృష్ట లేఖనం", "ఉద్దేశానుసార రచన"], "a": 0, "e": "ఒక అంశంపై ముందుగా రాసుకోకుండా, సొంతంగా ఆలోచించి మాట్లాడటాన్ని ఉక్తరచన అంటారు."}, {"q": "విద్యార్థులతో ఏర్పాటు చేసిన సారస్వత సంఘానికి వీరు ఉపాధ్యక్షులు", "o": ["స్థానిక కవి", "ప్రధానోపాధ్యాయులు", "భాషోపాధ్యాయులు", "విద్యార్థి నాయకుడు"], "a": 2, "e": "పాఠశాల సారస్వత సంఘానికి ప్రధానోపాధ్యాయులు అధ్యక్షులుగా, భాషోపాధ్యాయులు ఉపాధ్యక్షులుగా ఉంటారు."}, {"q": "విద్యార్థి తనకెదురైన ఒక సన్నివేశాన్ని గురించి రాయడానికి ఉద్దేశించిన రికార్డు", "o": ["పోర్ట్ ఫోలియో", "సంఘటన రచన", "ప్రాజెక్టుపని", "నివేదిక"], "a": 1, "e": "విద్యార్థి తనకు ఎదురైన ఒక నిర్దిష్ట సంఘటనను తన మాటల్లో రాయడాన్ని సంఘటన రచన (Anecdotal record) అంటారు."}, {"q": "కొంతకాలంలో నిర్దేశించిన పాఠ్యాంశాలలో పిల్లలు ఏ మేరకు విద్యాప్రమాణాలను సాధించారో తెలుసుకోవడానికి ఉద్దేశించినది", "o": ["సంగ్రహణాత్మక మూల్యాంకనం", "నిర్మాణాత్మక మూల్యాంకనం", "నియత మూల్యాంకనం", "రూపణ మూల్యాంకనం"], "a": 0, "e": "ఒక నిర్ణీత కాలం ముగిసిన తరువాత సాధించిన ప్రమాణాలను కొలిచేది సంగ్రహణాత్మక మూల్యాంకనం (Summative). బోధన జరుగుతుండగా చేసేది నిర్మాణాత్మకం (Formative)."}, {"q": "ప్రకల్పన పద్ధతిలో ఒక కార్యక్రమం పూర్తి చేసి మూల్యాంకనం చేయడాన్ని ఇలా అంటాం", "o": ["సంకలన మూల్యాంకనం", "ప్రాగుక్తిక మూల్యాంకనం", "లోపనిర్ధారణ మూల్యాంకనం", "రూపణ మూల్యాంకనం"], "a": 0, "e": "కార్యక్రమం పూర్తయిన తరువాత మొత్తం ఫలితాన్ని అంచనా వేయడాన్ని సంకలన మూల్యాంకనం అంటారు."}, {"q": "ఉపాధ్యాయుడు తరగతి గదిలో బోధనాభ్యసన ప్రక్రియలో విద్యార్థి నిర్దిష్ట సమస్యలను గుర్తించి, వాటికి కారణాలు తెలుసుకొని, సాంకేతిక పద్ధతుల సహాయంతో పరిష్కారాలు కనుగొని బోధించడమే", "o": ["లోప నిర్ధారణ మూల్యాంకనం", "లోప నివారణ బోధన", "నిర్మాణాత్మక బోధన", "సహకారాత్మక బోధన"], "a": 1, "e": "సమస్యలను గుర్తించి, కారణాలు తెలుసుకొని, వాటిని సరిదిద్దేలా చేసే బోధనను లోప నివారణ (Remedial) బోధన అంటారు. కేవలం లోపాలను గుర్తించడం లోప నిర్ధారణ."}, {"q": "ఒక నికషను అనేక పర్యాయాలు విద్యార్థులకు నిర్వహించినా ఒకే ఫలితాలను ఇస్తే ఆ నికషకు ఈ లక్షణం ఉంది.", "o": ["సప్రమాణత", "విచక్షణాశక్తి", "వస్త్వాశ్రయత", "విశ్వసనీయత"], "a": 3, "e": "ఎన్నిసార్లు నిర్వహించినా ఒకే ఫలితాలు ఇవ్వడాన్ని విశ్వసనీయత (Reliability) అంటారు — అంటే స్థిరత్వం."}, {"q": "ఒక నికష ఏ విషయాన్ని పరీక్షించడానికి తయారు చేయడం జరిగిందో అదే విషయాన్ని అది సరిగ్గా పరీక్షించినట్లైతే ఆ నికషకు ఈ లక్షణం ఉంది.", "o": ["వస్త్వాశ్రయత", "విశ్వసనీయత", "సప్రమాణత", "ఆచరణాత్మకత"], "a": 2, "e": "దేనిని కొలవాలనుకున్నారో దానినే కొలవడాన్ని సప్రమాణత (Validity) అంటారు. ఇది నికష యొక్క అత్యంత ముఖ్య లక్షణం."}]}];
const stage = document.getElementById('stage');
const bar = document.getElementById('bar');
BATCHES.forEach(function(b){ b.answered = new Array(b.qs.length).fill(null); b.score = 0; });
let bi = -1, i = 0;

function menu(){
  bi = -1;
  bar.hidden = true;
  const h = document.createElement('h2');
  h.textContent = 'బ్యాచ్ ఎంచుకోండి';
  const grid = document.createElement('div');
  grid.className = 'grid';
  BATCHES.forEach(function(b, n){
    const btn = document.createElement('button');
    btn.className = 'batch'; btn.type = 'button';
    const r = document.createElement('div');
    r.className = 'range'; r.textContent = b.from + '–' + b.to;
    const t = document.createElement('p');
    t.className = 'topic'; t.textContent = b.topic;
    btn.appendChild(r); btn.appendChild(t);
    const attempted = b.answered.filter(function(x){ return x !== null; }).length;
    if(attempted){
      const d = document.createElement('div');
      d.className = 'done';
      d.textContent = attempted + '/' + b.qs.length + ' పూర్తి · స్కోరు ' + b.score;
      btn.appendChild(d);
    }
    btn.addEventListener('click', function(){ bi = n; i = 0; render(); });
    grid.appendChild(btn);
  });
  stage.replaceChildren(h, grid);
}

function render(){
  const b = BATCHES[bi];
  if(i >= b.qs.length) return finish();
  bar.hidden = false;
  const q = b.qs[i], pick = b.answered[i];
  document.getElementById('count').textContent = 'ప్రశ్న ' + (b.from + i) + ' / ' + b.to;
  document.getElementById('fill').style.width = (i / b.qs.length * 100) + '%';
  document.getElementById('score').textContent = 'స్కోరు ' + b.score;

  const card = document.createElement('div');
  card.className = 'card';
  const no = document.createElement('span');
  no.className = 'qno'; no.textContent = 'ప్రశ్న ' + (b.from + i);
  card.appendChild(no);

  if(q.passage){
    const p = document.createElement('p');
    p.className = 'qtext'; p.textContent = q.passage; card.appendChild(p);
  }
  const ask = document.createElement('p');
  ask.className = q.passage ? 'qask' : 'qtext';
  ask.textContent = q.q; card.appendChild(ask);

  const ul = document.createElement('div');
  ul.className = 'opts';
  q.o.forEach(function(text, n){
    const btn = document.createElement('button');
    btn.className = 'opt'; btn.type = 'button';
    btn.innerHTML = '<span class="k">' + (n+1) + ')</span><span class="t"></span>';
    btn.querySelector('.t').textContent = text;
    if(pick !== null){
      btn.disabled = true;
      if(n === q.a) btn.classList.add('correct');
      else if(n === pick) btn.classList.add('wrong');
    } else {
      btn.addEventListener('click', function(){ choose(n); });
    }
    ul.appendChild(btn);
  });
  card.appendChild(ul);

  if(pick !== null){
    const box = document.createElement('div');
    box.className = 'exp';
    const v = document.createElement('p');
    v.className = 'verdict ' + (pick === q.a ? 'y' : 'n');
    v.textContent = pick === q.a ? '✓ సరైన సమాధానం'
      : '✗ తప్పు — సరైనది: ' + (q.a+1) + ') ' + q.o[q.a];
    const h = document.createElement('h3'); h.textContent = 'వివరణ';
    const p = document.createElement('p'); p.textContent = q.e;
    box.appendChild(v); box.appendChild(h); box.appendChild(p);
    card.appendChild(box);
  }

  const nav = document.createElement('div');
  nav.className = 'nav';
  const home = document.createElement('button');
  home.className = 'act ghost'; home.type = 'button'; home.textContent = '☰ బ్యాచ్‌లు';
  home.addEventListener('click', menu);
  nav.appendChild(home);
  if(i > 0){
    const prev = document.createElement('button');
    prev.className = 'act ghost'; prev.type = 'button'; prev.textContent = '◀ వెనుకకు';
    prev.addEventListener('click', function(){ i--; render(); });
    nav.appendChild(prev);
  }
  const next = document.createElement('button');
  next.className = 'act primary'; next.type = 'button';
  next.textContent = (i === b.qs.length - 1) ? 'ఫలితం చూడండి' : 'తరువాత ▶';
  next.disabled = (pick === null);
  next.addEventListener('click', function(){ i++; render(); });
  nav.appendChild(next);
  card.appendChild(nav);

  stage.replaceChildren(card);
}

function choose(n){
  const b = BATCHES[bi];
  if(b.answered[i] !== null) return;
  b.answered[i] = n;
  if(n === b.qs[i].a) b.score++;
  render();
}

function finish(){
  const b = BATCHES[bi];
  document.getElementById('fill').style.width = '100%';
  document.getElementById('count').textContent = 'బ్యాచ్ ' + b.from + '–' + b.to + ' పూర్తయింది';
  document.getElementById('score').textContent = 'స్కోరు ' + b.score;
  const pct = Math.round(b.score / b.qs.length * 100);
  const card = document.createElement('div');
  card.className = 'card result';
  card.innerHTML = '<p>మీ స్కోరు</p><div class="big">' + b.score + ' / ' + b.qs.length +
    '</div><p>' + pct + '% — ' + (pct>=80?'అద్భుతం!':pct>=60?'బాగుంది, మరింత సాధన చేయండి.':'మళ్ళీ సాధన చేయండి.') + '</p>';
  const nav = document.createElement('div');
  nav.className = 'nav'; nav.style.justifyContent = 'center';
  const again = document.createElement('button');
  again.className = 'act primary'; again.type = 'button'; again.textContent = 'మళ్ళీ ప్రారంభించు';
  again.addEventListener('click', function(){ b.answered.fill(null); b.score = 0; i = 0; render(); });
  const rev = document.createElement('button');
  rev.className = 'act ghost'; rev.type = 'button'; rev.textContent = 'సమాధానాలు సమీక్షించు';
  rev.addEventListener('click', function(){ i = 0; render(); });
  const home = document.createElement('button');
  home.className = 'act ghost'; home.type = 'button'; home.textContent = '☰ బ్యాచ్‌లు';
  home.addEventListener('click', menu);
  nav.appendChild(again); nav.appendChild(rev); nav.appendChild(home);
  card.appendChild(nav);
  stage.replaceChildren(card);
}

menu();
</script>

</body>
</html>
